project: orthopedic_ct_segformer3d
experiment_name: cpu_binary_engineering_ct_only
seed: 42

data:
  dataset_name: CTSpine1K_MSD_T10_engineering
  processed_root: data/processed_ctspine1k_real
  split_file: data/splits/ctspine1k_msd_t10_cpu_binary_engineering.json
  input_channels:
    - ct_normalized
  label_mode: binary
  foreground_probability: 0.8
  target_spacing_xyz_mm: [1.0, 1.0, 1.0]
  hu_clip: [-1000, 2000]
  roi_size_dhw: [36, 36, 36]
  num_classes: 2

model:
  name: segformer3d
  in_channels: 1
  sr_ratios: [4, 2, 1, 1]
  embed_dims: [32, 64, 160, 256]
  patch_kernel_size: [7, 3, 3, 3]
  patch_stride: [4, 2, 2, 2]
  patch_padding: [3, 1, 1, 1]
  mlp_ratios: [4, 4, 4, 4]
  num_heads: [1, 2, 5, 8]
  depths: [2, 2, 2, 2]
  decoder_head_embedding_dim: 256
  decoder_dropout: 0.0
  num_classes: 2

loss:
  type: region_dice_ce
  weights:
    region: 1.0
    boundary: 0.0
    topology: 0.0
  include_background: false

optimizer:
  type: adamw
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  type: cosine_annealing_warm_restarts
  warmup_epochs: 2
  t0_epochs: 10
  min_lr: 0.000006

training:
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 0
  amp: false
  save_metric: dice
  early_stopping_patience: 5

validation:
  patch_mode: true
  foreground_probability: 1.0

inference:
  sliding_window: true
  roi_size_dhw: [36, 36, 36]
  sw_batch_size: 1
  overlap: 0.0
  calibration:
    enabled: true
    n_bins: 15
    metric_max_samples: 500000

logging:
  wandb_mode: offline
  save_per_case_metrics: true
  save_predictions: false
  save_uncertainty: false
