project: orthopedic_ct_segformer3d
experiment_name: ct_bone_jointloss_hardaug_uncertainty
seed: 42

data:
  dataset_name: TBD
  processed_root: data/processed
  split_file: data/splits/TBD.json
  input_channels:
    - ct_normalized
    - bone_window
  label_mode: binary
  foreground_probability: 0.7
  target_spacing_xyz_mm: [1.0, 1.0, 1.0]
  hu_clip: [-1000, 2000]
  bone_window:
    center: 500
    width: 2000
  roi_size_dhw: [128, 128, 128]
  num_classes: 2

model:
  name: segformer3d
  in_channels: 2
  sr_ratios: [4, 2, 1, 1]
  embed_dims: [32, 64, 160, 256]
  patch_kernel_size: [7, 3, 3, 3]
  patch_stride: [4, 2, 2, 2]
  patch_padding: [3, 1, 1, 1]
  mlp_ratios: [4, 4, 4, 4]
  num_heads: [1, 2, 5, 8]
  depths: [2, 2, 2, 2]
  decoder_head_embedding_dim: 256
  decoder_dropout: 0.1
  num_classes: 2

loss:
  type: joint_orthopedic
  weights:
    region: 1.0
    boundary: 0.1
    topology: 0.1
  topology_iterations: 10
  include_background: false

augmentation:
  enabled: true
  geometric:
    random_flip: true
    flip_probability: 0.5
    flip_axes: [0, 1, 2]
    random_rotate_deg: 10
    random_scale_range: [0.9, 1.1]
    transform_probability: 0.5
  intensity:
    probability: 0.5
    gamma_range: [0.85, 1.15]
    gaussian_noise_std_range: [0.0, 0.03]
    hu_shift_range: [-100, 100]
  hard_sampling:
    enabled: true
    strategy: boundary_proxy
    boundary_probability: 0.35

optimizer:
  type: adamw
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  type: cosine_annealing_warm_restarts
  warmup_epochs: 20
  t0_epochs: 400
  min_lr: 0.000006

training:
  epochs: 800
  batch_size: 1
  gradient_accumulation_steps: 2
  num_workers: 4
  amp: true
  save_metric: dice
  early_stopping_patience: 100

inference:
  sliding_window: true
  roi_size_dhw: [128, 128, 128]
  sw_batch_size: 1
  overlap: 0.5
  uncertainty:
    enabled: true
    method: entropy
    roi_selection: top_percent
    top_percent: 10
    refinement: false
  calibration:
    enabled: true
    n_bins: 15
    metric_max_samples: 500000

logging:
  wandb_mode: offline
  save_per_case_metrics: true
  save_predictions: true
  save_uncertainty: true
