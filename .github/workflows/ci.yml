name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python tests and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned SegFormer3D upstream
        shell: pwsh
        run: ./env/fetch_segformer3d.ps1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: env/requirements.txt

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip wheel

      - name: Install CPU PyTorch 2.1 stack
        run: >-
          python -m pip install
          torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: python -m pip install -r env/requirements.txt

      - name: Run Ruff
        run: python -m ruff check src web tests

      - name: Run pytest
        run: python -m pytest tests -q

  static-checks:
    name: Frontend and repository static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.11 for static checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check frontend JavaScript syntax
        run: |
          node --check web/frontend/app.js
          node --check web/frontend/qc_review.js
          node --check web/frontend/research_3d.js
          node --check web/frontend/results_review.js

      - name: Validate tracked JSON files
        shell: python
        run: |
          import json
          from pathlib import Path

          files = [
              Path("data/datasets.json"),
              Path("configs/label_schemas/ctspine1k_verse.json"),
              Path("configs/task_specs/vertebra_task_template.json"),
          ]
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK: {path}")

      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem -Path env, web -Recurse -Filter *.ps1 -File
          $scripts += Get-ChildItem -Path . -Filter *.ps1 -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "PowerShell syntax check failed: $($script.FullName)"
            }
            Write-Host "OK: $($script.FullName)"
          }
